# ShardForgeDB — Docker Compose multi-node demo
#
# Starts 3 independent shardforge-node processes, each with its own data directory.
# This is NOT a distributed cluster: no Raft, no consensus, no quorum replication,
# no shared state, no automatic failover. Each node is an independent networked
# key-value store. This is the networked node runtime foundation.
#
# Usage:
#   docker compose -f deploy/docker-compose.yml up --build
#   curl http://localhost:9101/healthz
#   curl http://localhost:9102/healthz
#   curl http://localhost:9103/healthz
#   docker compose -f deploy/docker-compose.yml down -v

services:
  shardforge-node-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: shardforge-node-1
    command:
      - --node-id=node-1
      - --addr=0.0.0.0:9101
      - --data-dir=/data/node-1
    ports:
      - "9101:9101"
    volumes:
      - node1-data:/data/node-1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9101/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  shardforge-node-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: shardforge-node-2
    command:
      - --node-id=node-2
      - --addr=0.0.0.0:9102
      - --data-dir=/data/node-2
    ports:
      - "9102:9102"
    volumes:
      - node2-data:/data/node-2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9102/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  shardforge-node-3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: shardforge-node-3
    command:
      - --node-id=node-3
      - --addr=0.0.0.0:9103
      - --data-dir=/data/node-3
    ports:
      - "9103:9103"
    volumes:
      - node3-data:/data/node-3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9103/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  node1-data:
  node2-data:
  node3-data:
